<!-- @dsCard group="Actions" height=250 subtitle="The one primary action on a page or slide" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  html { background: var(--canvas); }
  body { margin: 0; padding: var(--space-6); color: var(--ink); font: 400 1.125rem/1.6 var(--font-sans); }
  .cap { color: var(--ink-muted); font: 400 0.9375rem/1.45 var(--font-sans); }
  .states { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: flex-start; }
  .state { display: grid; gap: var(--space-2); justify-items: start; }
</style></head><body>
<div id="root"></div>
<script>
var h = React.createElement, T = window.Torres;
ReactDOM.createRoot(document.getElementById("root")).render(
h("div", { className: "states" },
  h("div", { className: "state" }, h(T.Button, null, "Connect on LinkedIn"), h("span", { className: "cap" }, "Rest")),
  h("div", { className: "state" }, h(T.Button, { state: "hover" }, "Connect on LinkedIn"), h("span", { className: "cap" }, "Hover: ink fill")),
  h("div", { className: "state" }, h(T.Button, { state: "focus" }, "Connect on LinkedIn"), h("span", { className: "cap" }, "Focus")))
);
</script>
</body></html>
