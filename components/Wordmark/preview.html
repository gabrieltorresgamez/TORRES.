<!-- @dsCard group="Brand" height=270 subtitle="A site's name in uppercase type, with an orange full stop" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  html { background: var(--canvas); }
  body { margin: 0; padding: var(--space-6); color: var(--ink); font: 400 1.125rem/1.6 var(--font-sans); }
  .cap { color: var(--ink-muted); font: 400 0.9375rem/1.45 var(--font-sans); }
  .states { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: flex-start; }
  .state { display: grid; gap: var(--space-2); justify-items: start; }
  .row { padding: var(--space-3) 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: 0; }
</style></head><body>
<div id="root"></div>
<script>
var h = React.createElement, T = window.Torres;
ReactDOM.createRoot(document.getElementById("root")).render(
h("div", null,
  ["TORRES", "FUET", "ARC", "TORRES OS"].map(function (n) { return h("div", { className: "row", key: n }, h(T.Wordmark, { name: n })); }))
);
</script>
</body></html>
